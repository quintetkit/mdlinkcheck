# この action を、この action 自身のリポジトリに対して実行する。
# 「使える」と書くだけでなく、毎回実際に動かして証明するため。
name: self-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  use-the-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run this action against this repository
        uses: ./
        with:
          path: .

  # 公開しているタグが外部から本当に使えるかを確かめる。
  # ./ での実行が通っても、タグが指すコミットが壊れていれば利用者は動かない。
  published-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the published v1 tag against this repository
        uses: quintetkit/mdlinkcheck@v1
        with:
          path: .
